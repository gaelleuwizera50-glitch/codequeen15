<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />


</head>
<body>
    
    <div class="Container">
        <p>This is my page</p>
        <!-- red container -->
        <div class="childContainer">
 
            <div><p>Icon</p></div>
          <div><p>Menu</p></div>
        </div>
        <!-- blue container -->
        <div class="blue-container">
            <div class="Flex-items">Item 1</div>
            <div class="Flex-items">Item 2</div>
            <div class="Flex-items">Item 3</div>
            <div class="Flex-items">Item 4</div>
        </div>
    <img src="https://upload.wikimedia.org/wikipedia/commons/9/95/Instagram_logo_2022.svg" alt="">
<i class="fa-brands fa-instagram"></i>
        <!-- last / purple container -->
        <div>
            <img src="images/apples.jpg" alt="">
        </div>
    </div>

</body>
</html>
